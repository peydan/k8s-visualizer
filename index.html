    // --- MAIN APP COMPONENT ---
    function App() {
      const [viewMode, setViewMode] = useState('canvas'); // 'canvas' | 'traffic' | 'yaml' | 'terminal' | 'glossary'
      const [activePresetId, setActivePresetId] = useState(PRESETS[0].id);
      const [selectedElement, setSelectedElement] = useState(null);
      const [selectedNamespaceFilter, setSelectedNamespaceFilter] = useState('all');
      const [namespacesList, setNamespacesList] = useState(['default', 'production', 'database', 'monitoring', 'kube-system']);
      const [cpuLoad, setCpuLoad] = useState(30);
      const [showSecretMap, setShowSecretMap] = useState({});

      // Builder Modals
      const [activeModal, setActiveModal] = useState(null); // 'deployment' | 'service' | 'ingress' | 'namespace'
      const [depForm, setDepForm] = useState({ name: 'api-server', image: 'node:20-alpine', port: 3000, replicas: 2, ns: 'production' });
      const [svcForm, setSvcForm] = useState({ name: 'api-svc', type: 'ClusterIP', port: 80, targetPort: 3000, key: 'app', val: 'api-server', ns: 'production' });
      const [newNsName, setNewNsName] = useState('');

      // Cluster State
      const [cluster, setCluster] = useState(() => JSON.parse(JSON.stringify(PRESETS[0].state)));
      const [logs, setLogs] = useState([
        { id: 'l1', timestamp: new Date().toLocaleTimeString(), source: 'API-Server', type: 'info', message: 'KubeVerse cluster initialized with learning tooltips on all elements.' }
      ]);

      // Traffic Screen Specific State
      const [trafficMethod, setTrafficMethod] = useState('GET');
      const [trafficPath, setTrafficPath] = useState('/');
      const [trafficHost, setTrafficHost] = useState('app.example.com');
      const [isStreaming, setIsStreaming] = useState(false);
      const [activeHop, setActiveHop] = useState(0);
      const [lastResponse, setLastResponse] = useState(null);
      const [selectedPodForTraffic, setSelectedPodForTraffic] = useState(null);
      const [podHitStats, setPodHitStats] = useState({});
      const [totalTrafficCount, setTotalTrafficCount] = useState(0);

      const addLog = useCallback((source, type, message) => {
        setLogs(prev => [
          { id: 'log-' + Math.random().toString(36).substring(2, 7), timestamp: new Date().toLocaleTimeString(), source, type, message },
          ...prev.slice(0, 49)
        ]);
      }, []);

      const loadPreset = (presetId) => {
        const p = PRESETS.find(item => item.id === presetId);
        if (!p) return;
        setActivePresetId(presetId);
        setCluster(JSON.parse(JSON.stringify(p.state)));
        setSelectedNamespaceFilter('all');
        setSelectedElement(null);
        setPodHitStats({});
        setTotalTrafficCount(0);
        setLastResponse(null);
        setActiveHop(0);
        setIsStreaming(false);
        addLog('API-Server', 'info', `Loaded architecture preset: "${p.name}".`);
      };

      // Filtered views based on selectedNamespaceFilter
      const visiblePods = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.pods;
        return cluster.pods.filter(p => p.namespace === selectedNamespaceFilter);
      }, [cluster.pods, selectedNamespaceFilter]);

      const visibleServices = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.services;
        return cluster.services.filter(s => s.namespace === selectedNamespaceFilter);
      }, [cluster.services, selectedNamespaceFilter]);

      const visibleConfigMaps = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.configMaps;
        return cluster.configMaps.filter(c => c.namespace === selectedNamespaceFilter);
      }, [cluster.configMaps, selectedNamespaceFilter]);

      const visibleSecrets = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.secrets;
        return cluster.secrets.filter(s => s.namespace === selectedNamespaceFilter);
      }, [cluster.secrets, selectedNamespaceFilter]);

      const visiblePvcs = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.pvcs;
        return cluster.pvcs.filter(p => p.namespace === selectedNamespaceFilter);
      }, [cluster.pvcs, selectedNamespaceFilter]);

      // Service and Node mapping effects
      useEffect(() => {
        setCluster(prev => {
          const updatedNodes = prev.nodes.map(node => {
            const assignedPods = prev.pods.filter(p => p.nodeId === node.id && p.status !== 'Terminating');
            const cpuAllocated = assignedPods.reduce((sum, p) => sum + (p.containers[0]?.cpuRequest || 0.25), 0);
            const memAllocated = assignedPods.reduce((sum, p) => sum + (p.containers[0]?.memRequest || 128), 0);
            return {
              ...node,
              pods: assignedPods.map(p => p.id),
              cpuAllocated: Math.min(node.cpuTotal, Number(cpuAllocated.toFixed(2))),
              memAllocated: Math.min(node.memTotal, memAllocated)
            };
          });

          const updatedServices = prev.services.map(svc => {
            const matched = prev.pods.filter(pod => {
              if (pod.status !== 'Running') return false;
              if (pod.namespace !== svc.namespace) return false;
              return Object.entries(svc.selector).every(([k, v]) => pod.labels && pod.labels[k] === v);
            }).map(p => p.id);

            return { ...svc, matchedPodIds: matched };
          });

          return { ...prev, nodes: updatedNodes, services: updatedServices };
        });
      }, [cluster.pods.length, cluster.deployments.length]);

      // --- SIMULATION & CHAOS ACTIONS ---
      const killPod = (podId) => {
        const pod = cluster.pods.find(p => p.id === podId);
        if (!pod) return;
        addLog('ChaosMonkey', 'error', `Killed Pod "${pod.name}" in namespace "${pod.namespace}". Triggering self-healing.`);
        setCluster(prev => ({
          ...prev,
          pods: prev.pods.map(p => p.id === podId ? { ...p, status: 'CrashLoopBackOff' } : p)
        }));

        setTimeout(() => {
          setCluster(prev => {
            const dead = prev.pods.find(p => p.id === podId);
            if (!dead || !dead.deploymentId) return { ...prev, pods: prev.pods.filter(p => p.id !== podId) };
            const dep = prev.deployments.find(d => d.id === dead.deploymentId);
            const readyNodes = prev.nodes.filter(n => n.status === 'Ready');
            const target = readyNodes[Math.floor(Math.random() * readyNodes.length)] || prev.nodes[0];
            const replacement = {
              id: `pod-${dead.deploymentId}-${Math.random().toString(36).substring(2, 6)}`,
              name: `${dep?.name || 'pod'}-${Math.random().toString(36).substring(2, 7)}-heal`,
              deploymentId: dead.deploymentId,
              nodeId: target ? target.id : 'unassigned',
              namespace: dead.namespace,
              status: 'ContainerCreating',
              ip: `10.244.1.${Math.floor(Math.random() * 150) + 20}`,
              containers: dead.containers,
              restartCount: dead.restartCount + 1,
              cpuUsage: 10,
              memoryUsage: 64,
              labels: dead.labels
            };
            return { ...prev, pods: [...prev.pods.filter(p => p.id !== podId), replacement] };
          });
          addLog('ControllerManager', 'warning', `Self-healing: Recreated replica in namespace "${pod.namespace}".`);

          setTimeout(() => {
            setCluster(prev => ({ ...prev, pods: prev.pods.map(p => p.status === 'ContainerCreating' ? { ...p, status: 'Running' } : p) }));
            addLog('Kubelet', 'success', 'Replacement pod passed health checks.');
          }, 1200);
        }, 1000);
      };

      const scaleDeployment = (deploymentId, targetCount) => {
        setCluster(prev => {
          const dep = prev.deployments.find(d => d.id === deploymentId);
          if (!dep) return prev;
          const currentPods = prev.pods.filter(p => p.deploymentId === deploymentId && p.status !== 'Terminating');
          const readyNodes = prev.nodes.filter(n => n.status === 'Ready');
          const diff = targetCount - currentPods.length;
          let updatedPods = [...prev.pods];

          if (diff > 0 && readyNodes.length > 0) {
            for (let i = 0; i < diff; i++) {
              const targetNode = readyNodes[(currentPods.length + i) % readyNodes.length];
              updatedPods.push({
                id: `pod-${dep.name}-${Math.random().toString(36).substring(2, 6)}`,
                name: `${dep.name}-${Math.random().toString(36).substring(2, 7)}-${currentPods.length + i + 1}`,
                deploymentId: dep.id,
                nodeId: targetNode.id,
                namespace: dep.namespace,
                status: 'Running',
                ip: `10.244.${(i % 3) + 1}.${Math.floor(Math.random() * 200) + 10}`,
                containers: [dep.container],
                restartCount: 0,
                cpuUsage: 18,
                memoryUsage: 90,
                labels: dep.selector
              });
            }
          } else if (diff < 0) {
            const toRemove = currentPods.slice(0, Math.abs(diff)).map(p => p.id);
            updatedPods = updatedPods.filter(p => !toRemove.includes(p.id));
          }

          return {
            ...prev,
            deployments: prev.deployments.map(d => d.id === deploymentId ? { ...d, replicas: targetCount } : d),
            pods: updatedPods
          };
        });
        addLog('ControllerManager', 'info', `Deployment scaled to ${targetCount} replicas.`);
      };

      const toggleCpuSpike = () => {
        const nextLoad = cpuLoad >= 70 ? 25 : 85;
        setCpuLoad(nextLoad);
        addLog('HPA', nextLoad >= 70 ? 'warning' : 'info', `Cluster CPU load set to ${nextLoad}%.`);
        if (cluster.hpa && nextLoad >= cluster.hpa.targetCpuUtilization) {
          const dep = cluster.deployments.find(d => d.id === cluster.hpa.targetDeploymentId);
          if (dep && dep.replicas < cluster.hpa.maxReplicas) {
            const scaled = Math.min(cluster.hpa.maxReplicas, dep.replicas + 2);
            setTimeout(() => {
              scaleDeployment(dep.id, scaled);
              addLog('HPA', 'success', `Autoscaler scaled "${dep.name}" to ${scaled} replicas!`);
              if (window.confetti) window.confetti({ particleCount: 70, spread: 70 });
            }, 1000);
          }
        }
      };

      const addNode = () => {
        const nextIdx = cluster.nodes.length + 1;
        const zones = ['us-east-1a', 'us-east-1b', 'us-east-1c', 'us-west-2a'];
        const newNode = {
          id: `node-worker-${Date.now().toString().slice(-4)}`,
          name: `worker-node-${nextIdx}`,
          type: 'worker',
          status: 'Ready',
          ip: `192.168.1.${100 + nextIdx}`,
          zone: zones[nextIdx % zones.length],
          cpuTotal: 8,
          cpuAllocated: 0,
          memTotal: 16384,
          memAllocated: 0,
          pods: []
        };
        setCluster(prev => ({ ...prev, nodes: [...prev.nodes, newNode] }));
        addLog('API-Server', 'success', `Worker Node "${newNode.name}" joined the cluster.`);
      };

      const drainNode = (nodeId) => {
        setCluster(prev => {
          const available = prev.nodes.filter(n => n.id !== nodeId && n.status === 'Ready');
          if (available.length === 0) return prev;
          const updatedPods = prev.pods.map(pod => {
            if (pod.nodeId === nodeId) {
              const target = available[Math.floor(Math.random() * available.length)];
              return { ...pod, nodeId: target.id };
            }
            return pod;
          });
          return {
            ...prev,
            nodes: prev.nodes.map(n => n.id === nodeId ? { ...n, status: 'Cordoned', pods: [] } : n),
            pods: updatedPods
          };
        });
        addLog('ControllerManager', 'warning', 'Drained node: Evacuated all pods to remaining healthy nodes.');
      };

      // --- DEDICATED TRAFFIC PIPELINE DISPATCH ---
      const dispatchPacket = useCallback(() => {
        const matchingRule = cluster.ingress?.rules.find(r => r.path === trafficPath || trafficPath.startsWith(r.path));
        const svc = matchingRule 
          ? cluster.services.find(s => s.name === matchingRule.serviceName) 
          : cluster.services[0];

        setActiveHop(1);

        setTimeout(() => {
          setActiveHop(2);

          if (!matchingRule && trafficPath === '/unknown') {
            setTimeout(() => {
              setActiveHop(5);
              setLastResponse({
                status: 404,
                statusText: '404 Not Found',
                podName: 'None (Rejected at Ingress)',
                latency: 1.2,
                dnat: 'No Route Matched',
                body: { error: 'Path not found on Ingress controller', host: trafficHost, path: trafficPath }
              });
              addLog('Ingress', 'warning', `404 Not Found: Path "${trafficPath}" has no backend.`);
            }, 400);
            return;
          }

          setTimeout(() => {
            setActiveHop(3);
            const healthyPods = cluster.pods.filter(p => svc && svc.matchedPodIds.includes(p.id) && p.status === 'Running');

            if (!svc || healthyPods.length === 0) {
              setTimeout(() => {
                setActiveHop(5);
                setLastResponse({
                  status: 503,
                  statusText: '503 Service Unavailable',
                  podName: 'None (Zero Endpoints)',
                  latency: 2.1,
                  dnat: 'Failed - 0 Matching Healthy Pods',
                  body: { error: 'No healthy pod endpoints available', service: svc?.name || 'none' }
                });
                addLog('Kube-Proxy', 'error', '503 Service Unavailable: No healthy pod endpoints.');
              }, 400);
              return;
            }

            const chosenPod = healthyPods[Math.floor(Math.random() * healthyPods.length)];
            setSelectedPodForTraffic(chosenPod);

            setTimeout(() => {
              setActiveHop(4);
              setPodHitStats(prev => ({ ...prev, [chosenPod.id]: (prev[chosenPod.id] || 0) + 1 }));
              setTotalTrafficCount(prev => prev + 1);

              setTimeout(() => {
                setActiveHop(5);
                const latency = Number((Math.random() * 2 + 2.5).toFixed(1));
                setLastResponse({
                  status: 200,
                  statusText: '200 OK',
                  podName: chosenPod.name,
                  podIp: chosenPod.ip,
                  nodeId: chosenPod.nodeId,
                  namespace: chosenPod.namespace,
                  latency,
                  dnat: `${svc.clusterIP}:${svc.port} → ${chosenPod.ip}:${chosenPod.containers[0]?.port || 8080}`,
                  body: {
                    message: "Request successfully served by container",
                    servedByPod: chosenPod.name,
                    podIP: chosenPod.ip,
                    workerNode: chosenPod.nodeId,
                    namespace: chosenPod.namespace,
                    timestamp: new Date().toISOString()
                  }
                });
                addLog('Kube-Proxy', 'success', `200 OK: ${trafficMethod} ${trafficPath} served by [${chosenPod.namespace}]/${chosenPod.name} (${latency}ms).`);
              }, 350);
            }, 350);
          }, 350);
        }, 350);
      }, [cluster, trafficHost, trafficPath, trafficMethod, addLog]);

      useEffect(() => {
        if (!isStreaming) return;
        const interval = setInterval(dispatchPacket, 600);
        return () => clearInterval(interval);
      }, [isStreaming, dispatchPacket]);

      // --- BUILDER HANDLERS ---
      const handleCreateNamespace = (e) => {
        e.preventDefault();
        if (!newNsName.trim()) return;
        const formatted = newNsName.toLowerCase().replace(/[^a-z0-9-]/g, '-');
        if (!namespacesList.includes(formatted)) {
          setNamespacesList(prev => [...prev, formatted]);
          setSelectedNamespaceFilter(formatted);
          addLog('API-Server', 'success', `Created Namespace "${formatted}".`);
        }
        setNewNsName('');
        setActiveModal(null);
      };

      const handleCreateDeployment = (e) => {
        e.preventDefault();
        const depId = `dep-${Date.now().toString().slice(-4)}`;
        const selector = { app: depForm.name.toLowerCase().replace(/\s+/g, '-') };
        const readyNodes = cluster.nodes.filter(n => n.status === 'Ready');
        if (readyNodes.length === 0) return;

        const newPods = [];
        for (let i = 0; i < depForm.replicas; i++) {
          const targetNode = readyNodes[i % readyNodes.length];
          newPods.push({
            id: `pod-${depForm.name.toLowerCase()}-${Math.random().toString(36).substring(2, 6)}`,
            name: `${depForm.name.toLowerCase()}-${Math.random().toString(36).substring(2, 7)}-${i + 1}`,
            deploymentId: depId,
            nodeId: targetNode.id,
            namespace: depForm.ns,
            status: 'Running',
            ip: `10.244.1.${Math.floor(Math.random() * 200) + 10}`,
            containers: [{ name: depForm.name, image: depForm.image, port: Number(depForm.port), cpuRequest: 0.2, memRequest: 128 }],
            restartCount: 0,
            cpuUsage: 15,
            memoryUsage: 80,
            labels: selector
          });
        }

        setCluster(prev => ({
          ...prev,
          deployments: [...prev.deployments, { id: depId, name: depForm.name, namespace: depForm.ns, replicas: Number(depForm.replicas), selector, container: { name: depForm.name, image: depForm.image, port: Number(depForm.port), cpuRequest: 0.2, memRequest: 128 }, strategy: 'RollingUpdate', configMaps: [], secrets: [] }],
          pods: [...prev.pods, ...newPods]
        }));
        setActiveModal(null);
        addLog('API-Server', 'success', `Created Deployment "${depForm.name}" in namespace "${depForm.ns}".`);
      };

      const handleCreateService = (e) => {
        e.preventDefault();
        const svcId = `svc-${Date.now().toString().slice(-4)}`;
        const selector = { [svcForm.key]: svcForm.val };
        const matched = cluster.pods.filter(p => p.namespace === svcForm.ns && p.labels && p.labels[svcForm.key] === svcForm.val).map(p => p.id);

        setCluster(prev => ({
          ...prev,
          services: [...prev.services, { id: svcId, name: svcForm.name, namespace: svcForm.ns, type: svcForm.type, clusterIP: `10.96.${Math.floor(Math.random() * 200)}.${Math.floor(Math.random() * 200)}`, externalIP: svcForm.type === 'LoadBalancer' ? '35.240.88.10' : undefined, port: Number(svcForm.port), targetPort: Number(svcForm.targetPort), selector, matchedPodIds: matched }]
        }));
        setActiveModal(null);
        addLog('API-Server', 'success', `Created Service "${svcForm.name}" in namespace "${svcForm.ns}".`);
      };

      // --- GENERATE YAML ---
      const generatedYaml = useMemo(() => {
        const chunks = [];
        cluster.deployments.forEach(dep => {
          chunks.push(`apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ${dep.name}\n  namespace: ${dep.namespace}\nspec:\n  replicas: ${dep.replicas}\n  selector:\n    matchLabels:\n      ${Object.entries(dep.selector).map(([k, v]) => `${k}: ${v}`).join('\n      ')}\n  template:\n    metadata:\n      labels:\n        ${Object.entries(dep.selector).map(([k, v]) => `${k}: ${v}`).join('\n        ')}\n    spec:\n      containers:\n      - name: ${dep.container.name}\n        image: ${dep.container.image}\n        ports:\n        - containerPort: ${dep.container.port}`);
        });
        cluster.services.forEach(svc => {
          chunks.push(`apiVersion: v1\nkind: Service\nmetadata:\n  name: ${svc.name}\n  namespace: ${svc.namespace}\nspec:\n  type: ${svc.type}\n  selector:\n    ${Object.entries(svc.selector).map(([k, v]) => `${k}: ${v}`).join('\n    ')}\n  ports:\n  - port: ${svc.port}\n    targetPort: ${svc.targetPort}`);
        });
        return chunks.join('\n---\n');
      }, [cluster]);

      // --- RUN KUBECTL ---
      const runKubectl = (cmdStr) => {
        const parts = cmdStr.trim().split(/\s+/);
        if (parts[0] !== 'kubectl') return `Command not found: "${parts[0]}". Type "kubectl help".`;
        const sub = parts[1];
        const res = parts[2];
        if (!sub || sub === 'help') return 'Available:\n  kubectl get (pods | nodes | svc | ns | all)\n  kubectl scale deployment <name> --replicas=<num>\n  kubectl delete pod <name>';
        if (sub === 'get' && (res === 'pods' || res === 'pod' || res === 'po')) {
          return `NAMESPACE       NAME                                READY  STATUS    NODE\n` + cluster.pods.map(p => `${p.namespace.padEnd(15)} ${p.name.padEnd(35)} 1/1    ${p.status.padEnd(9)} ${p.nodeId}`).join('\n');
        }
        if (sub === 'get' && (res === 'nodes' || res === 'no')) {
          return `NAME                 STATUS   INTERNAL-IP\n` + cluster.nodes.map(n => `${n.name.padEnd(20)} ${n.status.padEnd(8)} ${n.ip}`).join('\n');
        }
        if (sub === 'get' && (res === 'svc' || res === 'services')) {
          return `NAMESPACE       NAME                 TYPE        CLUSTER-IP       PORT(S)\n` + cluster.services.map(s => `${s.namespace.padEnd(15)} ${s.name.padEnd(20)} ${s.type.padEnd(11)} ${s.clusterIP.padEnd(16)} :${s.port}`).join('\n');
        }
        return `Executed: "${cmdStr}".`;
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER WITH RICH TOOLTIPS */}
          <header className="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-xl border-b border-slate-800 px-4 py-2.5 shadow-xl">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              {/* Brand */}
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setViewMode('canvas')}>
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-400 p-0.5 flex items-center justify-center shadow-lg shadow-blue-500/20">
                  <div className="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center text-cyan-400">
                    <Icon name="box" className="w-5 h-5" />
                  </div>
                </div>
                <div>
                  <h1 className="font-extrabold text-base font-mono text-white flex items-center gap-1.5">

                    <span className="text-[10px] font-bold px-1.5 py-0.2 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30">Lab</span>
                  </h1>
                </div>
              </div>

              {/* View Switcher Tabs */}
              <div className="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
                <button

                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                    viewMode === 'canvas' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'

                <button

                    viewMode === 'traffic'
                      ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-bold shadow-lg shadow-cyan-500/30'
                      : 'text-cyan-400 hover:text-cyan-200 bg-cyan-950/30 border border-cyan-500/30'
                  }`}
                >
                  <Icon name="map" className="w-3.5 h-3.5 text-cyan-300 animate-pulse" />
                  <span>Traffic Route Map</span>
                </button>

                <button
                  onClick={() => setViewMode('yaml')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                    viewMode === 'yaml' ? 'bg-amber-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icon name="fileCode" className="w-3.5 h-3.5" />
                  <span>Live YAML</span>
                </button>

                <button

                    viewMode === 'terminal' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'

                >
                  <Icon name="terminal" className="w-3.5 h-3.5" />
                  <span>Kubectl CLI</span>
                </button>

                <button
                  onClick={() => setViewMode('glossary')}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-lg transition-all ${
                    viewMode === 'glossary' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Icon name="bookOpen" className="w-3.5 h-3.5" />
                  <span>Glossary</span>
                </button>
              </div>

              {/* Preset Selector & Action Buttons Wrapped in Tooltips */}
              <div className="flex items-center gap-2">
                <select
                  value={activePresetId}
                  onChange={(e) => loadPreset(e.target.value)}
                  className="bg-slate-950 text-cyan-300 text-xs font-semibold py-1.5 px-2.5 rounded-lg border border-slate-700 hover:border-cyan-500/50 cursor-pointer focus:outline-none"
                  title="Switch between multi-namespace, HPA autoscaling, and stateful database topologies"
                >
                  {PRESETS.map(p => (
                    <option key={p.id} value={p.id} className="bg-slate-900 text-slate-200">{p.name}</option>
                  ))}
                </select>

                <Tooltip conceptId="traffic-send">
                  <button
                    onClick={() => { setViewMode('traffic'); dispatchPacket(); }}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-xs font-bold shadow-lg shadow-cyan-500/20 hover:from-cyan-400 hover:to-blue-500 transition-all active:scale-95 whitespace-nowrap"
                  >
                    <Icon name="send" className="w-3.5 h-3.5" />
                    <span>Send Traffic</span>
                  </button>
                </Tooltip>

                <Tooltip conceptId="chaos-monkey">
                  <button
                    onClick={() => {
                      const running = cluster.pods.filter(p => p.status === 'Running');
                      if (running.length > 0) killPod(running[Math.floor(Math.random() * running.length)].id);
                    }}
                    className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-lg shadow-rose-600/20 transition-all active:scale-95 whitespace-nowrap"
                  >
                    <Icon name="skull" className="w-3.5 h-3.5" />
                    <span>Chaos Monkey</span>
                  </button>
                </Tooltip>

                <Tooltip conceptId="cpu-load">
                  <button
                    onClick={toggleCpuSpike}
                    className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-bold border transition-all whitespace-nowrap ${
                      cpuLoad >= 70 ? 'bg-amber-500/20 text-amber-300 border-amber-500/50 animate-pulse' : 'bg-slate-800 text-slate-300 border-slate-700'
                    }`}
                  >
                    <Icon name="zap" className="w-3.5 h-3.5 text-amber-400" />
                    <span>CPU {cpuLoad}%</span>
                  </button>
                </Tooltip>

                <button
                  onClick={() => loadPreset(activePresetId)}
                  className="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700"
                  title="Reset cluster state"
                >
                  <Icon name="rotateCcw" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {/* ============================================================== */}
            {/* 1. VISUAL CANVAS VIEW (ALL ELEMENTS HAVE RICH TOOLTIPS) */}
            {/* ============================================================== */}
            {viewMode === 'canvas' && (
              <div className="space-y-6 pb-28 animate-fadeIn">
                {/* Namespace Selector Banner */}
                <div className="p-4 rounded-2xl bg-slate-900/90 border border-slate-800 shadow-xl space-y-3">
                  <div className="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 pb-3">
                    <Tooltip conceptId="namespace">
                      <div className="flex items-center gap-2 cursor-pointer" onClick={() => setSelectedElement({ type: 'concept', id: 'namespace' })}>
                        <div className="p-1.5 rounded-lg bg-purple-500/10 text-purple-400 border border-purple-500/30">
                          <Icon name="folder" className="w-4 h-4" />
                        </div>
                        <div>
                          <div className="font-mono font-bold text-xs text-white flex items-center gap-1.5">
                            <span>Namespace Scope Filter</span>
                            <span className="text-[9px] px-1.5 rounded bg-slate-800 text-slate-400">Virtual Isolation</span>
                          </div>
                          <div className="text-[10px] text-slate-400 font-mono">Nodes span all namespaces; pods/services belong to a namespace</div>
                        </div>
                      </div>
                    </Tooltip>

                    <div className="flex flex-wrap gap-1.5">
                      <button
                        onClick={() => setSelectedNamespaceFilter('all')}
                        className={`px-3 py-1 rounded-xl text-xs font-mono font-bold ${
                          selectedNamespaceFilter === 'all' ? 'bg-blue-600 text-white shadow' : 'bg-slate-950 border border-slate-800 text-slate-400'
                        }`}
                      >
                        All ({cluster.pods.length})
                      </button>
                      {namespacesList.map(ns => (
                        <button
                          key={ns}
                          onClick={() => setSelectedNamespaceFilter(ns)}
                          className={`px-3 py-1 rounded-xl text-xs font-mono font-bold border ${
                            selectedNamespaceFilter === ns ? `${getNsColor(ns).bg} ${getNsColor(ns).text} ${getNsColor(ns).border}` : 'bg-slate-950 border-slate-800 text-slate-400'
                          }`}
                        >
                          {ns}
                        </button>
                      ))}
                      <button
                        onClick={() => setActiveModal('namespace')}
                        className="px-2.5 py-1 rounded-xl bg-slate-800 text-cyan-300 text-xs font-mono font-bold border border-slate-700 flex items-center gap-1"
                      >
                        <Icon name="plus" className="w-3 h-3" />
                        <span>Namespace</span>
                      </button>
                    </div>
                  </div>

                  {/* Summary Bar */}
                  <div className="flex flex-wrap items-center justify-between text-xs font-mono text-slate-300">
                    <div className="flex items-center gap-3">
                      <span>Nodes: <strong className="text-cyan-400">{cluster.nodes.length}</strong></span>
                      <span>•</span>
                      <span>Pods: <strong className="text-emerald-400">{cluster.pods.filter(p => p.status === 'Running').length}/{cluster.pods.length}</strong></span>
                      <span>•</span>
                      <span>Services: <strong className="text-amber-400">{visibleServices.length}</strong></span>
                    </div>
                    {cluster.hpa && (
                      <Tooltip conceptId="hpa">
                        <span className="px-2 py-0.5 rounded bg-emerald-950/40 border border-emerald-500/30 text-emerald-300 flex items-center gap-1 text-[11px] cursor-pointer" onClick={() => setSelectedElement({ type: 'concept', id: 'hpa' })}>
                          <Icon name="trendingUp" className="w-3.5 h-3.5 text-emerald-400" />
                          HPA Active ({cluster.hpa.minReplicas}-{cluster.hpa.maxReplicas} pods)
                        </span>
                      </Tooltip>
                    )}
                  </div>
                </div>

                {/* 1. Control Plane */}
                <div className="bg-slate-900/60 border border-slate-800 rounded-2xl p-4 shadow-lg">
                  <div className="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></span>
                      <h3 className="text-xs font-bold text-slate-200 font-mono uppercase tracking-wider">Control Plane (Master Node)</h3>
                      <span className="text-[10px] px-2 py-0.2 rounded-full bg-purple-500/10 text-purple-400 border border-purple-500/30 font-mono">
                        ns: kube-system
                      </span>
                    </div>
                    <div className="text-[11px] text-emerald-400 font-mono flex items-center gap-1">
                      <Icon name="shieldCheck" className="w-3.5 h-3.5" />
                      <span>Quorum Active</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {['api-server', 'etcd', 'scheduler', 'controller-manager'].map(id => (
                      <Tooltip key={id} conceptId={id}>
                        <div
                          onClick={() => setSelectedElement({ type: 'concept', id })}
                          className="p-3 rounded-xl bg-slate-950/70 border border-slate-800 hover:border-cyan-500/50 hover:bg-slate-900 transition-all cursor-pointer group"
                        >
                          <div className="flex items-center justify-between mb-1">
                            <div className="p-1 rounded-lg bg-blue-500/10 text-blue-400 group-hover:scale-110 transition-transform">
                              <Icon name={K8S_CONCEPTS[id].iconName} className="w-4 h-4" />
                            </div>
                            <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                          </div>
                          <div className="font-mono font-bold text-xs text-white group-hover:text-cyan-300">{K8S_CONCEPTS[id].name}</div>
                          <div className="text-[10px] text-slate-500 truncate">{K8S_CONCEPTS[id].shortDescription}</div>
                        </div>
                      </Tooltip>
                    ))}
                  </div>
                </div>

                {/* 2. Ingress Controller */}
                {cluster.ingress && (
                  <div>
                    <div className="flex items-center gap-2 mb-2 font-mono text-xs font-bold text-slate-300">
                      <Icon name="globe" className="w-4 h-4 text-emerald-400" />
                      <span>Layer 7 Ingress Controller</span>
                    </div>
                    <Tooltip conceptId="ingress">
                      <div
                        onClick={() => setSelectedElement({ type: 'ingress', id: cluster.ingress.id })}
                        className="p-3.5 rounded-xl bg-slate-900 border border-emerald-500/40 hover:border-emerald-400 cursor-pointer shadow-lg max-w-md"
                      >
                        <div className="flex items-center justify-between mb-2">
                          <div className="flex items-center gap-2">
                            <div className="p-1 rounded-lg bg-emerald-500/10 text-emerald-400">
                              <Icon name="globe" className="w-4 h-4" />
                            </div>
                            <div>
                              <div className="font-mono font-bold text-xs text-white">{cluster.ingress.name}</div>
                              <div className="text-[9px] font-mono text-slate-400">Controller: {cluster.ingress.controller.toUpperCase()}</div>
                            </div>
                          </div>
                          <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded border bg-emerald-500/10 text-emerald-400 border-emerald-500/30">
                            ns: {cluster.ingress.namespace}
                          </span>
                        </div>
                        <div className="bg-slate-950 rounded-lg p-2 font-mono text-[11px] text-slate-300 border border-slate-800 space-y-1">
                          {cluster.ingress.rules.map((r, i) => (
                            <div key={i} className="flex items-center justify-between">
                              <span className="text-cyan-300">{r.host}{r.path}</span>
                              <span className="text-emerald-400 flex items-center gap-1 font-semibold">
                                <Icon name="arrowRight" className="w-2.5 h-2.5 text-slate-500" />
                                {r.serviceName}:{r.servicePort}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>
                    </Tooltip>
                  </div>
                )}

                {/* 3. Services */}
                {visibleServices.length > 0 && (
                  <div>
                    <div className="flex items-center justify-between mb-2 font-mono text-xs font-bold text-slate-300">
                      <div className="flex items-center gap-2">
                        <Icon name="share2" className="w-4 h-4 text-amber-400" />
                        <span>Services & Load Balancers ({visibleServices.length})</span>

                      </div>

                      {/* Animated Hops Cards */}
                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 relative z-10">
                        {/* HOP 1: CLIENT */}
                        <div className={`p-4 rounded-2xl border transition-all duration-300 flex flex-col justify-between ${
                          activeHop === 1
                            ? 'bg-cyan-950/60 border-cyan-400 shadow-xl shadow-cyan-950/50 ring-2 ring-cyan-400/60 scale-105'
                            : 'bg-slate-950 border-slate-800 opacity-80'
                        }`}>
                          <div>
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300">Hop 1</span>
                              {activeHop === 1 && <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>}
                            </div>
                            <h4 className="font-mono font-bold text-xs text-white">Client Browser</h4>
                            <p className="text-[11px] text-slate-400 font-mono mt-1">Public Internet</p>
                          </div>
                          <div className="mt-3 p-2 rounded bg-slate-900 font-mono text-[10px] text-cyan-300 border border-slate-800">
                            {trafficMethod} {trafficPath}
                          </div>
                        </div>

                        {/* HOP 2: INGRESS */}
                        <div className={`p-4 rounded-2xl border transition-all duration-300 flex flex-col justify-between ${
                          activeHop === 2
                            ? 'bg-emerald-950/60 border-emerald-400 shadow-xl shadow-emerald-950/50 ring-2 ring-emerald-400/60 scale-105'
                            : 'bg-slate-950 border-slate-800 opacity-80'
                        }`}>
                          <div>
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300">Hop 2: L7</span>
                              {activeHop === 2 && <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>}
                            </div>
                            <h4 className="font-mono font-bold text-xs text-white">Ingress Controller</h4>
                            <p className="text-[11px] text-slate-400 font-mono mt-1">SSL & Path Rules</p>
                          </div>
                          <div className="mt-3 p-2 rounded bg-slate-900 font-mono text-[10px] text-emerald-300 border border-slate-800 truncate">
                            Host: {trafficHost}
                          </div>
                        </div>

                        {/* HOP 3: SERVICE / KUBE-PROXY */}
                        <div className={`p-4 rounded-2xl border transition-all duration-300 flex flex-col justify-between ${
                          activeHop === 3
                            ? 'bg-amber-950/60 border-amber-400 shadow-xl shadow-amber-950/50 ring-2 ring-amber-400/60 scale-105'
                            : 'bg-slate-950 border-slate-800 opacity-80'
                        }`}>
                          <div>
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300">Hop 3: L4</span>
                              {activeHop === 3 && <span className="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>}
                            </div>
                            <h4 className="font-mono font-bold text-xs text-white">Service / kube-proxy</h4>
                            <p className="text-[11px] text-slate-400 font-mono mt-1">Virtual IP & DNAT</p>
                          </div>
                          <div className="mt-3 p-2 rounded bg-slate-900 font-mono text-[10px] text-amber-300 border border-slate-800 truncate">
                            VIP: 10.96.14.88:80
                          </div>
                        </div>

                        {/* HOP 4: TARGET POD */}
                        <div className={`p-4 rounded-2xl border transition-all duration-300 flex flex-col justify-between ${
                          activeHop === 4
                            ? 'bg-blue-950/60 border-blue-400 shadow-xl shadow-blue-950/50 ring-2 ring-blue-400/60 scale-105'
                            : 'bg-slate-950 border-slate-800 opacity-80'
                        }`}>
                          <div>
                            <div className="flex justify-between items-center mb-2">
                              <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-blue-500/20 text-blue-300">Hop 4: Target</span>
                              {activeHop === 4 && <span className="w-2 h-2 rounded-full bg-blue-400 animate-ping"></span>}
                            </div>
                            <h4 className="font-mono font-bold text-xs text-white">Container Socket</h4>
                            <p className="text-[11px] text-slate-400 font-mono mt-1">Pod Execution</p>
                          </div>
                          <div className="mt-3 p-2 rounded bg-slate-900 font-mono text-[10px] text-cyan-300 border border-slate-800 truncate">
                            {selectedPodForTraffic ? selectedPodForTraffic.name.substring(0, 16) + '...' : 'Pod Target'}
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* 3. HTTP RESPONSE & PAYLOAD INSPECTOR */}
                    <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
                      <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                        <div className="font-mono font-bold text-xs text-white uppercase tracking-wider flex items-center gap-2">
                          <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
                          <span>3. HTTP Response & DNAT Inspector</span>
                        </div>
                        {lastResponse && (
                          <div className="flex items-center gap-2 font-mono text-xs">
                            <span className={`px-2 py-0.5 rounded font-bold border ${
                              lastResponse.status === 200 ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' :
                              lastResponse.status === 404 ? 'bg-amber-500/20 text-amber-300 border-amber-500/40' : 'bg-rose-500/20 text-rose-300 border-rose-500/40'
                            }`}>
                              {lastResponse.statusText}
                            </span>
                            <span className="text-slate-400">Latency: <strong className="text-white">{lastResponse.latency}ms</strong></span>
                          </div>
                        )}
                      </div>

                      {lastResponse ? (
                        <div className="space-y-3 font-mono text-xs">
                          {/* DNAT Table */}
                          <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between items-center text-[11px]">
                            <span className="text-slate-400">kube-proxy DNAT Translation:</span>
                            <span className="text-cyan-300 font-bold">{lastResponse.dnat}</span>
                          </div>

                          {/* Response Body JSON */}
                          <div className="relative rounded-xl bg-slate-950 border border-slate-800 p-4">
                            <div className="text-slate-500 text-[10px] mb-2 uppercase font-bold">Response Body (JSON Payload)</div>
                            <pre className="text-cyan-300 text-xs overflow-x-auto leading-relaxed">
                              <code>{JSON.stringify(lastResponse.body, null, 2)}</code>
                            </pre>
                          </div>
                        </div>
                      ) : (
                        <div className="p-8 border-2 border-dashed border-slate-800 rounded-xl text-center text-slate-500 font-mono text-xs">
                          Click "Dispatch Single Packet" or "Continuous Stream" to trace a live request.
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ============================================================== */}
            {/* 3. LIVE YAML VIEW */}
            {/* ============================================================== */}
            {viewMode === 'yaml' && (
              <div className="max-w-4xl mx-auto space-y-4 animate-fadeIn">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-xl font-bold font-mono text-white flex items-center gap-2">
                    <Icon name="fileCode" className="w-6 h-6 text-amber-400" />
                    Live Generated YAML Manifest
                  </h2>
                  <button
                    onClick={() => { navigator.clipboard.writeText(generatedYaml); alert('Copied YAML!'); }}
                    className="px-3 py-1.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-200 border border-slate-700"
                  >
                    Copy YAML
                  </button>
                </div>
                <pre className="p-6 rounded-2xl bg-slate-950 border border-slate-800 text-xs font-mono text-cyan-300 overflow-x-auto leading-relaxed shadow-2xl">
                  <code>{generatedYaml}</code>
                </pre>
              </div>
            )}

            {/* ============================================================== */}
            {/* 4. KUBECTL CLI TERMINAL */}
            {viewMode === 'terminal' && (
              <div className="max-w-4xl mx-auto space-y-4 animate-fadeIn">
                <div className="border-b border-slate-800 pb-3">
                  <h2 className="text-xl font-bold font-mono text-white flex items-center gap-2">
                    <Icon name="terminal" className="w-6 h-6 text-emerald-400" />
                    Kubectl CLI Terminal Simulator
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">Try: <code className="text-cyan-300">kubectl get pods</code>, <code className="text-cyan-300">kubectl get nodes</code>, <code className="text-cyan-300">kubectl get svc</code></p>
                </div>
                <TerminalSimulator runKubectl={runKubectl} />
              </div>
            )}

            {/* ============================================================== */}
            {/* 5. GLOSSARY */}
            {viewMode === 'glossary' && (
              <div className="max-w-5xl mx-auto space-y-6 animate-fadeIn">
                <h2 className="text-xl font-bold font-mono text-white flex items-center gap-2 border-b border-slate-800 pb-3">
                  <Icon name="bookOpen" className="w-6 h-6 text-indigo-400" />
                  Kubernetes Architectural Encyclopedia
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {Object.values(K8S_CONCEPTS).map(c => (
                    <div
                      key={c.id}
                      onClick={() => setSelectedElement({ type: 'concept', id: c.id })}
                      className="p-5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-indigo-500/60 cursor-pointer space-y-2"
                    >
                      <h4 className="font-mono font-bold text-white text-base">{c.name}</h4>
                      <p className="text-xs text-slate-400">{c.shortDescription}</p>
                      {c.analogy && (
                        <div className="p-2 rounded bg-indigo-950/30 border border-indigo-500/20 text-[11px] text-indigo-200 italic">
                          {c.analogy}
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* FLOATING BUILDER TOOLBAR (ONLY ON CANVAS VIEW) */}
          {viewMode === 'canvas' && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 flex items-center">
              <div className="bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 rounded-2xl shadow-2xl p-2 flex items-center gap-1.5 ring-1 ring-white/10">
                <span className="px-3 py-1 text-xs font-mono font-bold text-slate-300 flex items-center gap-1.5 border-r border-slate-800">
                  <Icon name="wrench" className="w-3.5 h-3.5 text-cyan-400" />
                  <span>Builder:</span>
                </span>

                <Tooltip title="Add Worker Node" desc="Scales physical/virtual compute cluster capacity." position="top">
                  <button onClick={addNode} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-blue-600/30 text-xs font-semibold text-slate-200 hover:text-cyan-300 border border-slate-700 whitespace-nowrap">
                    <Icon name="server" className="w-3.5 h-3.5 text-blue-400" />
                    <span>+ Node</span>
                  </button>
                </Tooltip>

                <Tooltip title="Create Deployment" desc="Deploy new containerized app replicas across worker nodes." position="top">
                  <button onClick={() => setActiveModal('deployment')} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-cyan-600/30 text-xs font-semibold text-slate-200 hover:text-cyan-300 border border-slate-700 whitespace-nowrap">
                    <Icon name="layers" className="w-3.5 h-3.5 text-cyan-400" />
                    <span>+ Deployment</span>
                  </button>
                </Tooltip>

                <Tooltip title="Create Service" desc="Expose pods with a stable virtual ClusterIP & load balancer." position="top">
                  <button onClick={() => setActiveModal('service')} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-amber-600/30 text-xs font-semibold text-slate-200 hover:text-amber-300 border border-slate-700 whitespace-nowrap">
                    <Icon name="share2" className="w-3.5 h-3.5 text-amber-400" />
                    <span>+ Service</span>
                  </button>
                </Tooltip>

                <Tooltip title="Create Namespace" desc="Add a virtual isolation partition for new teams or apps." position="top">
                  <button onClick={() => setActiveModal('namespace')} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-purple-600/30 text-xs font-semibold text-slate-200 hover:text-purple-300 border border-slate-700 whitespace-nowrap">
                    <Icon name="folder" className="w-3.5 h-3.5 text-purple-400" />
                    <span>+ Namespace</span>
                  </button>
                </Tooltip>
              </div>
            </div>
          )}

          {/* LOGS DRAWER */}
          <LogsDrawer logs={logs} />

          {/* CONCEPT MODAL */}
          {selectedElement && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 font-mono text-xs">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="font-bold text-base text-white">{K8S_CONCEPTS[selectedElement.id]?.name}</h3>
                  <button onClick={() => setSelectedElement(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <p className="text-slate-300 font-sans text-xs leading-relaxed">{K8S_CONCEPTS[selectedElement.id]?.shortDescription}</p>
                {K8S_CONCEPTS[selectedElement.id]?.analogy && (
                  <div className="p-3 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-200 font-sans italic">
                    {K8S_CONCEPTS[selectedElement.id]?.analogy}
                  </div>
                )}
                {K8S_CONCEPTS[selectedElement.id]?.whyItMatters && (
                  <div className="space-y-1.5 font-sans">
                    {K8S_CONCEPTS[selectedElement.id]?.whyItMatters.map((point, idx) => (
                      <div key={idx} className="p-2 rounded bg-slate-800/60 text-slate-300 flex items-start gap-1.5">
                        <span className="text-cyan-400 font-bold">•</span>
                        <span>{point}</span>
                      </div>
                    ))}
                  </div>
                )}
                <pre className="p-3 rounded bg-slate-950 text-cyan-300 overflow-x-auto border border-slate-800">
                  <code>{K8S_CONCEPTS[selectedElement.id]?.yamlSnippet}</code>
                </pre>
              </div>
            </div>
          )}

          {/* MODALS */}
          {activeModal === 'namespace' && (
            <ModalWrapper title="Create Namespace" onClose={() => setActiveModal(null)}>
              <form onSubmit={handleCreateNamespace} className="space-y-3 text-xs font-mono">
                <div>
                  <label className="block text-slate-400 mb-1">Namespace Name</label>
                  <input type="text" value={newNsName} onChange={e => setNewNsName(e.target.value)} placeholder="e.g. analytics, staging" className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required autoFocus />
                </div>
                <button type="submit" className="w-full py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold mt-2">Create Namespace</button>
              </form>
            </ModalWrapper>
          )}

          {activeModal === 'deployment' && (
            <ModalWrapper title="Create Deployment" onClose={() => setActiveModal(null)}>
              <form onSubmit={handleCreateDeployment} className="space-y-3 text-xs font-mono">
                <div><label className="block text-slate-400 mb-1">Name</label><input type="text" value={depForm.name} onChange={e => setDepForm({...depForm, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                <div>
                  <label className="block text-slate-400 mb-1">Namespace</label>
                  <select value={depForm.ns} onChange={e => setDepForm({...depForm, ns: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white">
                    {namespacesList.map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
                <div><label className="block text-slate-400 mb-1">Image</label><input type="text" value={depForm.image} onChange={e => setDepForm({...depForm, image: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-400 mb-1">Port</label><input type="number" value={depForm.port} onChange={e => setDepForm({...depForm, port: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                  <div><label className="block text-slate-400 mb-1">Replicas</label><input type="number" min="1" max="8" value={depForm.replicas} onChange={e => setDepForm({...depForm, replicas: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                </div>
                <button type="submit" className="w-full py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold mt-2">Deploy Workload</button>
              </form>
            </ModalWrapper>
          )}

          {activeModal === 'service' && (
            <ModalWrapper title="Create Service" onClose={() => setActiveModal(null)}>
              <form onSubmit={handleCreateService} className="space-y-3 text-xs font-mono">
                <div><label className="block text-slate-400 mb-1">Name</label><input type="text" value={svcForm.name} onChange={e => setSvcForm({...svcForm, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                <div>
                  <label className="block text-slate-400 mb-1">Namespace</label>
                  <select value={svcForm.ns} onChange={e => setSvcForm({...svcForm, ns: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white">
                    {namespacesList.map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-400 mb-1">Port</label><input type="number" value={svcForm.port} onChange={e => setSvcForm({...svcForm, port: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                  <div><label className="block text-slate-400 mb-1">Target Port</label><input type="number" value={svcForm.targetPort} onChange={e => setSvcForm({...svcForm, targetPort: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                </div>
                <button type="submit" className="w-full py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold mt-2">Create Service</button>
              </form>
            </ModalWrapper>
          )}
        </div>
      );
    }

    // --- MODAL WRAPPER ---
    function ModalWrapper({ title, onClose, children }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl animate-fadeIn">
            <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
              <h3 className="font-mono font-bold text-white text-sm">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // --- LOGS DRAWER ---
    function LogsDrawer({ logs }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="fixed bottom-0 right-6 z-30 w-80 max-w-[calc(100vw-3rem)] font-mono text-xs">
          <div
            onClick={() => setOpen(!open)}
            className="bg-slate-900 border border-slate-700 rounded-t-xl px-4 py-2 flex items-center justify-between cursor-pointer shadow-xl backdrop-blur-md"
          >
            <div className="flex items-center gap-2 font-bold text-slate-200">
              <Icon name="terminal" className="w-3.5 h-3.5 text-emerald-400" />
              <span>Events ({logs.length})</span>
            </div>
            <span className="text-slate-500">{open ? '▼' : '▲'}</span>
          </div>
          {open && (
            <div className="bg-slate-950 border-x border-b border-slate-800 p-3 h-64 overflow-y-auto space-y-1.5 rounded-b-xl shadow-2xl">
              {logs.map(l => (
                <div key={l.id} className="p-1.5 rounded bg-slate-900/80 border border-slate-800 text-[11px] leading-relaxed">
                  <div className="flex justify-between text-[9px] text-slate-500 mb-0.5">
                    <span className="font-bold text-cyan-400">{l.source}</span>
                    <span>{l.timestamp}</span>
                  </div>
                  <div className="text-slate-300">{l.message}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- TERMINAL SIMULATOR ---
    function TerminalSimulator({ runKubectl }) {
      const [input, setInput] = useState('');
      const [history, setHistory] = useState([
        { id: '1', text: 'KubeVerse Interactive Kubectl Terminal [v1.30.2]\nType "kubectl get pods" or "kubectl get svc" to inspect.' }
      ]);
      const endRef = useRef(null);
      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [history]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        const out = runKubectl(input.trim());
        setHistory(prev => [...prev, { id: Math.random(), text: `$ ${input}` }, { id: Math.random(), text: out }]);
        setInput('');
      };

      return (
        <div className="bg-slate-950 border border-slate-800 rounded-2xl shadow-2xl p-4 font-mono text-xs flex flex-col h-[500px]">
          <div className="flex-1 overflow-y-auto space-y-2 text-slate-300 pr-2">
            {history.map(item => <pre key={item.id} className="whitespace-pre-wrap leading-relaxed">{item.text}</pre>)}
            <div ref={endRef}></div>
          </div>
          <form onSubmit={handleSubmit} className="flex items-center gap-2 pt-3 border-t border-slate-800 mt-2">
            <span className="text-emerald-400 font-bold">$</span>
            <input
              type="text"
              value={input}
              onChange={e => setInput(e.target.value)}
              placeholder="kubectl get pods, kubectl get svc, kubectl get ns"
              className="flex-1 bg-transparent text-white focus:outline-none placeholder:text-slate-600 text-xs"
              autoFocus
            />
          </form>
        </div>
      );
    }

    // Render to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
