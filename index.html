    // --- MAIN APP ROOT COMPONENT ---
    function App() {
      const [viewMode, setViewMode] = useState('canvas');
      const [activePresetId, setActivePresetId] = useState(PRESETS[0].id);
      const [selectedElement, setSelectedElement] = useState(null);
      const [cpuLoad, setCpuLoad] = useState(30);
      const [packets, setPackets] = useState([]);
      const [showSecretMap, setShowSecretMap] = useState({});
      
      // Namespace state: 'all' or specific namespace name
      const [selectedNamespaceFilter, setSelectedNamespaceFilter] = useState('all');
      const [namespacesList, setNamespacesList] = useState(['default', 'production', 'database', 'monitoring', 'kube-system']);

      // Builder Modals
      const [activeModal, setActiveModal] = useState(null); // 'deployment' | 'service' | 'ingress' | 'namespace'
      const [depForm, setDepForm] = useState({ name: 'api-server', image: 'node:20-alpine', port: 3000, replicas: 2, ns: 'production' });
      const [svcForm, setSvcForm] = useState({ name: 'api-svc', type: 'ClusterIP', port: 80, targetPort: 3000, key: 'app', val: 'api-server', ns: 'production' });
      const [ingForm, setIngForm] = useState({ host: 'api.example.com', path: '/', svc: 'web-service', port: 80, ns: 'production' });
      const [newNsName, setNewNsName] = useState('');

      // Cluster State
      const [cluster, setCluster] = useState(() => JSON.parse(JSON.stringify(PRESETS[0].state)));
      const [logs, setLogs] = useState([
        { id: 'l1', timestamp: new Date().toLocaleTimeString(), source: 'API-Server', type: 'info', message: 'KubeVerse multi-namespace cluster initialized.' },
        { id: 'l2', timestamp: new Date().toLocaleTimeString(), source: 'ControllerManager', type: 'success', message: 'Workloads scheduled across namespaces: production, database, monitoring.' }
      ]);

      const addLog = useCallback((source, type, message) => {
        setLogs(prev => [
          { id: 'log-' + Math.random().toString(36).substring(2, 7), timestamp: new Date().toLocaleTimeString(), source, type, message },
          ...prev.slice(0, 49)
        ]);
      }, []);

      const loadPreset = (presetId) => {
        const p = PRESETS.find(item => item.id === presetId);
        if (!p) return;
        setActivePresetId(presetId);
        setCluster(JSON.parse(JSON.stringify(p.state)));
        setSelectedNamespaceFilter(p.state.activeNamespace || 'all');
        setSelectedElement(null);
        addLog('API-Server', 'info', `Loaded architecture preset: "${p.name}".`);
      };

      // Filtered views based on selectedNamespaceFilter
      const visiblePods = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.pods;
        return cluster.pods.filter(p => p.namespace === selectedNamespaceFilter);
      }, [cluster.pods, selectedNamespaceFilter]);

      const visibleServices = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.services;
        return cluster.services.filter(s => s.namespace === selectedNamespaceFilter);
      }, [cluster.services, selectedNamespaceFilter]);

      const visibleDeployments = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.deployments;
        return cluster.deployments.filter(d => d.namespace === selectedNamespaceFilter);
      }, [cluster.deployments, selectedNamespaceFilter]);

      const visibleConfigMaps = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.configMaps;
        return cluster.configMaps.filter(c => c.namespace === selectedNamespaceFilter);
      }, [cluster.configMaps, selectedNamespaceFilter]);

      const visibleSecrets = useMemo(() => {
        if (selectedNamespaceFilter === 'all') return cluster.secrets;
        return cluster.secrets.filter(s => s.namespace === selectedNamespaceFilter);
      }, [cluster.secrets, selectedNamespaceFilter]);

      // Service and Node mapping effects
      useEffect(() => {
        setCluster(prev => {
          const updatedNodes = prev.nodes.map(node => {
            const assignedPods = prev.pods.filter(p => p.nodeId === node.id && p.status !== 'Terminating');
            const cpuAllocated = assignedPods.reduce((sum, p) => sum + (p.containers[0]?.cpuRequest || 0.25), 0);
            const memAllocated = assignedPods.reduce((sum, p) => sum + (p.containers[0]?.memRequest || 128), 0);
            return {
              ...node,
              pods: assignedPods.map(p => p.id),
              cpuAllocated: Math.min(node.cpuTotal, Number(cpuAllocated.toFixed(2))),
              memAllocated: Math.min(node.memTotal, memAllocated)
            };
          });

          const updatedServices = prev.services.map(svc => {
            const matched = prev.pods.filter(pod => {
              if (pod.status !== 'Running') return false;
              if (pod.namespace !== svc.namespace) return false;
              return Object.entries(svc.selector).every(([k, v]) => pod.labels && pod.labels[k] === v);
            }).map(p => p.id);

            return { ...svc, matchedPodIds: matched };
          });

          return { ...prev, nodes: updatedNodes, services: updatedServices };
        });
      }, [cluster.pods.length, cluster.deployments.length]);

      // --- SIMULATION ACTIONS ---
      const sendTraffic = () => {
        const targetServices = visibleServices.length > 0 ? visibleServices : cluster.services;
        if (targetServices.length === 0) {
          addLog('Ingress', 'warning', 'No services found in active namespace to route traffic.');
          return;
        }
        const svc = targetServices[0];
        const healthyPods = cluster.pods.filter(p => svc.matchedPodIds.includes(p.id) && p.status === 'Running');

        if (healthyPods.length === 0) {
          addLog('Kube-Proxy', 'error', `503 Service Unavailable: No healthy pods in namespace "${svc.namespace}".`);
          return;
        }

        const chosenPod = healthyPods[Math.floor(Math.random() * healthyPods.length)];
        const packetId = 'pkt-' + Math.random().toString(36).substring(2, 7);

        const packet = {
          id: packetId,
          targetPod: chosenPod.name,
          namespace: chosenPod.namespace,
          url: `http://${svc.name}.${svc.namespace}.svc.cluster.local:${svc.port}`,
          progress: 0
        };

        setPackets(prev => [...prev, packet]);
        addLog('Ingress', 'info', `Incoming request to namespace: [${chosenPod.namespace}]`);

        let step = 0;
        const interval = setInterval(() => {
          step += 25;
          setPackets(prev => prev.map(p => p.id === packetId ? { ...p, progress: step } : p));
          if (step >= 100) {
            clearInterval(interval);
            setTimeout(() => {
              setPackets(prev => prev.filter(p => p.id !== packetId));
              addLog('Kube-Proxy', 'success', `200 OK: Request served by [${chosenPod.namespace}]/${chosenPod.name} (4ms).`);
            }, 500);
          }
        }, 250);
      };

      const killPod = (podId) => {
        const pod = cluster.pods.find(p => p.id === podId);
        if (!pod) return;

        addLog('ChaosMonkey', 'error', `Terminated Pod "${pod.name}" in namespace "${pod.namespace}".`);
        
        setCluster(prev => ({
          ...prev,
          pods: prev.pods.map(p => p.id === podId ? { ...p, status: 'CrashLoopBackOff' } : p)
        }));

        setTimeout(() => {
          setCluster(prev => {
            const deadPod = prev.pods.find(p => p.id === podId);
            if (!deadPod || !deadPod.deploymentId) return { ...prev, pods: prev.pods.filter(p => p.id !== podId) };

            const dep = prev.deployments.find(d => d.id === deadPod.deploymentId);
            const readyNodes = prev.nodes.filter(n => n.status === 'Ready');
            const targetNode = readyNodes[Math.floor(Math.random() * readyNodes.length)] || prev.nodes[0];

            const replacementPod = {
              id: `pod-${deadPod.deploymentId}-${Math.random().toString(36).substring(2, 6)}`,
              name: `${dep?.name || 'pod'}-${Math.random().toString(36).substring(2, 7)}-heal`,
              deploymentId: deadPod.deploymentId,
              nodeId: targetNode ? targetNode.id : 'unassigned',
              namespace: deadPod.namespace,
              status: 'ContainerCreating',
              ip: `10.244.1.${Math.floor(Math.random() * 150) + 20}`,
              containers: deadPod.containers,
              restartCount: deadPod.restartCount + 1,
              cpuUsage: 10,
              memoryUsage: 64,
              labels: deadPod.labels,
              configMapRefs: deadPod.configMapRefs,
              secretRefs: deadPod.secretRefs
            };

            return { ...prev, pods: [...prev.pods.filter(p => p.id !== podId), replacementPod] };
          });

          addLog('ControllerManager', 'warning', `Self-healing: Recreated pod in namespace "${pod.namespace}".`);

          setTimeout(() => {
            setCluster(prev => ({
              ...prev,
              pods: prev.pods.map(p => p.status === 'ContainerCreating' ? { ...p, status: 'Running' } : p)
            }));
            addLog('Kubelet', 'success', `Container running and healthy.`);
          }, 1400);
        }, 1000);
      };

      const scaleDeployment = (deploymentId, targetCount) => {
        setCluster(prev => {
          const dep = prev.deployments.find(d => d.id === deploymentId);
          if (!dep) return prev;

          const currentPods = prev.pods.filter(p => p.deploymentId === deploymentId && p.status !== 'Terminating');
          const readyNodes = prev.nodes.filter(n => n.status === 'Ready');
          const diff = targetCount - currentPods.length;

          let updatedPods = [...prev.pods];

          if (diff > 0 && readyNodes.length > 0) {
            for (let i = 0; i < diff; i++) {
              const targetNode = readyNodes[(currentPods.length + i) % readyNodes.length];
              updatedPods.push({
                id: `pod-${dep.name}-${Math.random().toString(36).substring(2, 6)}`,
                name: `${dep.name}-${Math.random().toString(36).substring(2, 7)}-${currentPods.length + i + 1}`,
                deploymentId: dep.id,
                nodeId: targetNode.id,
                namespace: dep.namespace,
                status: 'Running',
                ip: `10.244.${(i % 3) + 1}.${Math.floor(Math.random() * 200) + 10}`,
                containers: [dep.container],
                restartCount: 0,
                cpuUsage: 18,
                memoryUsage: 90,
                labels: dep.selector,
                configMapRefs: dep.configMaps,
                secretRefs: dep.secrets
              });
            }
          } else if (diff < 0) {
            const toRemove = currentPods.slice(0, Math.abs(diff)).map(p => p.id);
            updatedPods = updatedPods.filter(p => !toRemove.includes(p.id));
          }

          return {
            ...prev,
            deployments: prev.deployments.map(d => d.id === deploymentId ? { ...d, replicas: targetCount } : d),
            pods: updatedPods
          };
        });
        addLog('ControllerManager', 'info', `Deployment scaled to ${targetCount} replicas.`);
      };

      const addNode = () => {
        const nextIdx = cluster.nodes.length + 1;
        const zones = ['us-east-1a', 'us-east-1b', 'us-east-1c', 'us-west-2a'];
        const newNode = {
          id: `node-worker-${Date.now().toString().slice(-4)}`,
          name: `worker-node-${nextIdx}`,
          type: 'worker',
          status: 'Ready',
          ip: `192.168.1.${100 + nextIdx}`,
          zone: zones[nextIdx % zones.length],
          cpuTotal: 8,
          cpuAllocated: 0,
          memTotal: 16384,
          memAllocated: 0,
          pods: []
        };
        setCluster(prev => ({ ...prev, nodes: [...prev.nodes, newNode] }));
        addLog('API-Server', 'success', `Worker Node "${newNode.name}" joined the cluster.`);
      };

      const handleCreateNamespace = (e) => {
        e.preventDefault();
        if (!newNsName.trim()) return;
        const formatted = newNsName.toLowerCase().replace(/[^a-z0-9-]/g, '-');
        if (!namespacesList.includes(formatted)) {
          setNamespacesList(prev => [...prev, formatted]);
          setSelectedNamespaceFilter(formatted);
          addLog('API-Server', 'success', `Created Namespace "${formatted}".`);
        }
        setNewNsName('');
        setActiveModal(null);
      };

      const handleCreateDeployment = (e) => {
        e.preventDefault();
        const depId = `dep-${Date.now().toString().slice(-4)}`;
        const selector = { app: depForm.name.toLowerCase().replace(/\s+/g, '-') };
        const readyNodes = cluster.nodes.filter(n => n.status === 'Ready');
        if (readyNodes.length === 0) return;

        const newPods = [];
        for (let i = 0; i < depForm.replicas; i++) {
          const targetNode = readyNodes[i % readyNodes.length];
          newPods.push({
            id: `pod-${depForm.name.toLowerCase()}-${Math.random().toString(36).substring(2, 6)}`,
            name: `${depForm.name.toLowerCase()}-${Math.random().toString(36).substring(2, 7)}-${i + 1}`,
            deploymentId: depId,
            nodeId: targetNode.id,
            namespace: depForm.ns,
            status: 'Running',
            ip: `10.244.1.${Math.floor(Math.random() * 200) + 10}`,
            containers: [{ name: depForm.name, image: depForm.image, port: Number(depForm.port), cpuRequest: 0.2, memRequest: 128 }],
            restartCount: 0,
            cpuUsage: 15,
            memoryUsage: 80,
            labels: selector
          });
        }

        setCluster(prev => ({
          ...prev,
          deployments: [...prev.deployments, { id: depId, name: depForm.name, namespace: depForm.ns, replicas: Number(depForm.replicas), selector, container: { name: depForm.name, image: depForm.image, port: Number(depForm.port), cpuRequest: 0.2, memRequest: 128 }, strategy: 'RollingUpdate', configMaps: [], secrets: [] }],
          pods: [...prev.pods, ...newPods]
        }));
        setActiveModal(null);
        addLog('API-Server', 'success', `Created Deployment "${depForm.name}" in namespace "${depForm.ns}".`);
      };

      const handleCreateService = (e) => {
        e.preventDefault();
        const svcId = `svc-${Date.now().toString().slice(-4)}`;
        const selector = { [svcForm.key]: svcForm.val };
        const matched = cluster.pods.filter(p => p.namespace === svcForm.ns && p.labels && p.labels[svcForm.key] === svcForm.val).map(p => p.id);

        setCluster(prev => ({
          ...prev,
          services: [...prev.services, { id: svcId, name: svcForm.name, namespace: svcForm.ns, type: svcForm.type, clusterIP: `10.96.${Math.floor(Math.random() * 200)}.${Math.floor(Math.random() * 200)}`, externalIP: svcForm.type === 'LoadBalancer' ? '35.240.88.10' : undefined, port: Number(svcForm.port), targetPort: Number(svcForm.targetPort), selector, matchedPodIds: matched }]
        }));
        setActiveModal(null);
        addLog('API-Server', 'success', `Created Service "${svcForm.name}" in namespace "${svcForm.ns}".`);
      };

      // --- KUBECTL RUNNER ---
      const runKubectl = (cmdStr) => {
        const parts = cmdStr.trim().split(/\s+/);
        if (parts[0] !== 'kubectl') return `Command not found: "${parts[0]}". Type "kubectl help".`;
        const sub = parts[1];
        const res = parts[2];

        if (!sub || sub === 'help') {
          return `Available commands:\n  kubectl get (namespaces | pods | nodes | deployments | services | all) [-n <ns> | -A]\n  kubectl scale deployment <name> --replicas=<num>\n  kubectl delete pod <name>\n  kubectl cluster-info`;
        }
        if (sub === 'get' && (res === 'namespaces' || res === 'namespace' || res === 'ns')) {
          return `NAME              STATUS   AGE\n` + namespacesList.map(n => `${n.padEnd(17)} Active   25d`).join('\n');
        }
        if (sub === 'get' && (res === 'pods' || res === 'pod' || res === 'po')) {
          return `NAMESPACE       NAME                                READY  STATUS    NODE\n` +
                 cluster.pods.map(p => `${p.namespace.padEnd(15)} ${p.name.padEnd(35)} 1/1    ${p.status.padEnd(9)} ${p.nodeId}`).join('\n');
        }
        if (sub === 'get' && (res === 'services' || res === 'svc')) {
          return `NAMESPACE       NAME                 TYPE        CLUSTER-IP       PORT(S)\n` +
                 cluster.services.map(s => `${s.namespace.padEnd(15)} ${s.name.padEnd(20)} ${s.type.padEnd(11)} ${s.clusterIP.padEnd(16)} :${s.port}`).join('\n');
        }
        if (sub === 'get' && res === 'all') {
          return `=== NAMESPACES ===\n` + namespacesList.join(', ') +
                 `\n\n=== PODS ===\n` + cluster.pods.map(p => `[${p.namespace}] ${p.name.padEnd(35)} 1/1 ${p.status} on ${p.nodeId}`).join('\n') +
                 `\n\n=== SERVICES ===\n` + cluster.services.map(s => `[${s.namespace}] ${s.name.padEnd(20)} ${s.clusterIP}:${s.port}`).join('\n');
        }
        return `Command executed: "${cmdStr}".`;
      };

      // --- GENERATE YAML ---
      const generatedYaml = useMemo(() => {
        const chunks = [];
        const nsToExport = selectedNamespaceFilter === 'all' ? namespacesList : [selectedNamespaceFilter];

        nsToExport.forEach(ns => {
          if (ns !== 'default') {
            chunks.push(`apiVersion: v1\nkind: Namespace\nmetadata:\n  name: ${ns}`);
          }
        });

        visibleDeployments.forEach(dep => {
          chunks.push(`apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: ${dep.name}\n  namespace: ${dep.namespace}\nspec:\n  replicas: ${dep.replicas}\n  selector:\n    matchLabels:\n      ${Object.entries(dep.selector).map(([k, v]) => `${k}: ${v}`).join('\n      ')}\n  template:\n    metadata:\n      labels:\n        ${Object.entries(dep.selector).map(([k, v]) => `${k}: ${v}`).join('\n        ')}\n    spec:\n      containers:\n      - name: ${dep.container.name}\n        image: ${dep.container.image}\n        ports:\n        - containerPort: ${dep.container.port}`);
        });

        visibleServices.forEach(svc => {
          chunks.push(`apiVersion: v1\nkind: Service\nmetadata:\n  name: ${svc.name}\n  namespace: ${svc.namespace}\nspec:\n  type: ${svc.type}\n  selector:\n    ${Object.entries(svc.selector).map(([k, v]) => `${k}: ${v}`).join('\n    ')}\n  ports:\n  - port: ${svc.port}\n    targetPort: ${svc.targetPort}`);
        });

        return chunks.join('\n---\n');
      }, [visibleDeployments, visibleServices, selectedNamespaceFilter, namespacesList]);

      // --- TOOLTIP HELPER ---

                    <span className="w-2 h-2 rounded-full" style={{ backgroundColor: c.color }}></span>
                    {c.name}

                <div className="text-[9px] text-cyan-400 mt-1 font-mono text-center">Click element to inspect details</div>
              </div>
            )}

            </div>
          </header>

                          </div>
                          <div>
                            <div className="font-mono font-bold text-xs text-white group-hover:text-cyan-300 flex items-center gap-1.5">
                              <span>Namespace Isolation Engine</span>

                    <div className="flex items-center gap-2">
                      <span className="text-[11px] font-mono text-slate-400 hidden sm:inline">Active Scope:</span>
                      <div className="flex flex-wrap gap-1.5">
                        {/* 'All Namespaces' filter */}

                        {/* Add Namespace Button */}

                {/* 2. INGRESS LAYER */}
                {cluster.ingress && (
                  <div>
                    <div className="flex items-center gap-2 mb-2 font-mono text-xs font-bold text-slate-300">
                      <Icon name="globe" className="w-4 h-4 text-emerald-400" />
                      <span>Layer 7 Ingress Controller</span>
                    </div>
                    <Tooltip conceptId="ingress">
                      <div
                        onClick={() => setSelectedElement({ type: 'ingress', id: cluster.ingress.id })}
                        className="p-3.5 rounded-xl bg-slate-900 border border-emerald-500/40 hover:border-emerald-400 cursor-pointer shadow-lg max-w-md"
                      >
                        <div className="flex items-center justify-between mb-2">
                          <div className="flex items-center gap-2">

                              <Icon name="globe" className="w-4 h-4" />
                            </div>
                            <div>
                              <div className="font-mono font-bold text-xs text-white">{cluster.ingress.name}</div>
                              <div className="text-[9px] font-mono text-slate-400">Controller: {cluster.ingress.controller.toUpperCase()}</div>

                {/* 3. SERVICES LAYER */}
                {visibleServices.length > 0 && (
                  <div>
                    <div className="flex items-center justify-between mb-2 font-mono text-xs font-bold text-slate-300">
                      <div className="flex items-center gap-2">

                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                      {visibleServices.map(svc => {

                                  <Icon name="checkCircle" className="w-3 h-3" />

                      <Icon name="server" className="w-4 h-4 text-blue-400" />

                    <button
                      onClick={addNode}

                      <Icon name="plus" className="w-3.5 h-3.5" />
                      <span>Add Worker Node</span>
                    </button>
                  </div>

                        : allNodePods.filter(p => p.namespace === selectedNamespaceFilter);
                      const cpuPct = Math.min(100, Math.round((node.cpuAllocated / node.cpuTotal) * 100));
                      const memPct = Math.min(100, Math.round((node.memAllocated / node.memTotal) * 100));

                      return (

                              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => setSelectedElement({ type: 'node', id: node.id })}>
                                <div className="p-2 rounded-xl bg-blue-600/10 text-blue-400 border border-blue-500/20">
                                  <Icon name="server" className="w-5 h-5" />
                                </div>
                                <div>
                                  <Tooltip conceptId="node">
                                    <h4 className="font-mono font-bold text-sm text-slate-100 hover:text-cyan-300">{node.name}</h4>
                                  </Tooltip>
                                  <div className="text-[11px] font-mono text-slate-400">IP: {node.ip} • Zone: {node.zone}</div>

                                  <button
                                    onClick={() => setCluster(prev => ({ ...prev, nodes: prev.nodes.filter(n => n.id !== node.id) }))}

                                    <Icon name="trash2" className="w-3.5 h-3.5" />

                            </div>

                            <div className="grid grid-cols-2 gap-3 mt-3 pt-3 border-t border-slate-800/60 font-mono text-[10px]">
                              <div>
                                <div className="flex justify-between text-slate-400 mb-1">
                                  <span>CPU ({node.cpuAllocated}/{node.cpuTotal} Cores)</span>
                                  <span className="text-slate-300 font-bold">{cpuPct}%</span>
                                </div>
                                <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                  <div className={`h-full ${cpuPct > 80 ? 'bg-rose-500' : 'bg-cyan-500'}`} style={{ width: `${cpuPct}%` }}></div>
                                </div>
                              </div>
                              <div>
                                <div className="flex justify-between text-slate-400 mb-1">
                                  <span>RAM ({node.memAllocated}/{node.memTotal} MB)</span>
                                  <span className="text-slate-300 font-bold">{memPct}%</span>
                                </div>
                                <div className="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                  <div className={`h-full ${memPct > 80 ? 'bg-rose-500' : 'bg-purple-500'}`} style={{ width: `${memPct}%` }}></div>
                                </div>
                              </div>
                            </div>
                          </div>

                          {/* Pods Grid */}
                          <div className="p-4 flex-1 space-y-2.5">
                            <div className="flex items-center justify-between text-[11px] font-mono text-slate-400 uppercase font-bold">
                              <span>Pods ({filteredNodePods.length})</span>

                                return (
                                  <Tooltip key={pod.id} conceptId="pod">
                                    <div
                                      onClick={() => setSelectedElement({ type: 'pod', id: pod.id })}
                                      className={`p-3 rounded-xl bg-slate-950 border transition-all cursor-pointer ${
                                        pod.status === 'CrashLoopBackOff' ? 'border-rose-500 animate-pulse' :
                                        pod.status === 'ContainerCreating' ? 'border-amber-500' : 'border-slate-800 hover:border-cyan-500/50'

                                      <div className="flex items-center justify-between mb-1.5">
                                        <div className="flex items-center gap-1.5 min-w-0">
                                          <div className="p-1 rounded bg-emerald-500/10 text-emerald-400">
                                            <Icon name="box" className="w-3.5 h-3.5" />

                                          <span className="font-mono text-xs font-bold text-slate-100 truncate">{pod.name}</span>

                                        <div className="flex items-center gap-1 shrink-0">

                                            ns: {pod.namespace}

                                          <button
                                            onClick={(e) => { e.stopPropagation(); killPod(pod.id); }}

                                            <Icon name="skull" className="w-3 h-3" />
                                          </button>
                                        </div>
                                      </div>
                                      <div className="bg-slate-900 rounded p-1.5 font-mono text-[10px] text-slate-400 flex justify-between">
                                        <span>Image: <strong className="text-cyan-300">{pod.containers[0]?.image}</strong></span>
                                        <span>IP: {pod.ip}</span>
                                      </div>
                                    </div>
                                  </Tooltip>
                                );
                              })
                            )}
                          </div>
                        </div>
                      );

                    <h3 className="text-xs font-bold text-slate-200 font-mono uppercase tracking-wider mb-3 border-b border-slate-800 pb-2">

                          <Icon name="sliders" className="w-3.5 h-3.5" />
                          <span>ConfigMaps ({visibleConfigMaps.length})</span>

                              <div className="text-[10px] font-mono text-slate-400 bg-slate-900 p-1.5 rounded truncate">

                              </div>
                            </div>

                        <div className="text-xs font-mono font-bold text-rose-400 flex items-center gap-1.5">
                          <Icon name="lock" className="w-3.5 h-3.5" />
                          <span>Secrets ({visibleSecrets.length})</span>

                          const isShown = Boolean(showSecretMap[sec.id]);

                            <div key={sec.id} className="p-3 rounded-xl bg-slate-950 border border-rose-500/30">
                              <div className="flex items-center justify-between mb-1">
                                <span className="font-mono text-xs font-bold text-slate-200">{sec.name}</span>
                                <div className="flex items-center gap-1">
                                  <span className={`text-[9px] font-mono px-1.5 py-0.2 rounded border ${nsColor.bg} ${nsColor.text} ${nsColor.border}`}>ns: {sec.namespace}</span>
                                  <button
                                    onClick={() => setShowSecretMap(prev => ({ ...prev, [sec.id]: !prev[sec.id] }))}

                                    <Icon name={isShown ? 'eyeOff' : 'eye'} className="w-3 h-3 text-rose-400" />
                                  </button>
                                </div>
                              </div>
                              <div className="text-[10px] font-mono text-slate-400 bg-slate-900 p-1.5 rounded truncate">
                                {Object.entries(sec.data).map(([k, v]) => `${k}: ${isShown ? v : '••••••••'}`).join(' | ')}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>

            {viewMode === 'yaml' && (
              <div className="max-w-4xl mx-auto space-y-4 animate-fadeIn">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h2 className="text-xl font-bold font-mono text-white flex items-center gap-2">
                    <Icon name="fileCode" className="w-6 h-6 text-amber-400" />

                    <button
                      onClick={() => { navigator.clipboard.writeText(generatedYaml); alert('YAML copied to clipboard!'); }}
                      className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-semibold text-slate-200 flex items-center gap-1.5 border border-slate-700"
                    >
                      <Icon name="copy" className="w-3.5 h-3.5" /> Copy YAML

                  </div>
                </div>
                <pre className="p-6 rounded-2xl bg-slate-950 border border-slate-800 text-xs font-mono text-cyan-300 overflow-x-auto leading-relaxed shadow-2xl">
                  <code>{generatedYaml}</code>
                </pre>
              </div>

              <div className="max-w-4xl mx-auto space-y-4 animate-fadeIn">

                    <Icon name="terminal" className="w-6 h-6 text-emerald-400" />
                    Kubectl CLI Terminal Simulator
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">Try commands like: <code className="text-cyan-300">kubectl get ns</code>, <code className="text-cyan-300">kubectl get pods -A</code>, <code className="text-cyan-300">kubectl get svc -A</code></p>
                </div>
                <TerminalSimulator runKubectl={runKubectl} />
              </div>
            )}

            {/* VIEW 4: GLOSSARY */}
            {viewMode === 'glossary' && (
              <div className="max-w-5xl mx-auto space-y-6 animate-fadeIn">
                <div className="border-b border-slate-800 pb-3">
                  <h2 className="text-xl font-bold font-mono text-white flex items-center gap-2">
                    <Icon name="bookOpen" className="w-6 h-6 text-indigo-400" />
                    Kubernetes Architectural Encyclopedia & Glossary
                  </h2>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {Object.values(K8S_CONCEPTS).map(c => (
                    <div
                      key={c.id}
                      onClick={() => setSelectedElement({ type: 'concept', id: c.id })}
                      className="p-5 rounded-2xl bg-slate-900 border border-slate-800 hover:border-indigo-500/60 transition-all cursor-pointer group flex flex-col justify-between"
                    >
                      <div className="space-y-2">
                        <div className="flex items-center justify-between">
                          <div className="p-2 rounded-xl" style={{ backgroundColor: `${c.color}20`, color: c.color }}>
                            <Icon name={c.iconName} className="w-5 h-5" />
                          </div>
                          <span className="text-[10px] font-mono uppercase px-2 py-0.5 rounded-full border" style={{ color: c.color, borderColor: `${c.color}40` }}>{c.kind || c.category}</span>
                        </div>
                        <h4 className="font-mono font-bold text-white text-base group-hover:text-indigo-300">{c.name}</h4>
                        <p className="text-xs text-slate-400 leading-relaxed">{c.shortDescription}</p>
                        {c.analogy && (
                          <div className="p-2 rounded bg-indigo-950/30 border border-indigo-500/20 text-[11px] text-indigo-200 italic">
                            {c.analogy}
                          </div>
                        )}
                      </div>
                      <div className="mt-3 pt-3 border-t border-slate-800 text-xs text-indigo-400 font-semibold flex justify-between items-center">
                        <span>Inspect & Commands</span>
                        <Icon name="arrowRight" className="w-3.5 h-3.5" />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* FLOATING BUILDER TOOLBAR */}
          {viewMode === 'canvas' && (
            <div className="fixed bottom-4 left-1/2 -translate-x-1/2 z-30 flex items-center">
              <div className="bg-slate-900/95 backdrop-blur-xl border border-slate-700/80 rounded-2xl shadow-2xl p-2 flex items-center gap-1.5 ring-1 ring-white/10">
                <span className="px-3 py-1 text-xs font-mono font-bold text-slate-300 flex items-center gap-1.5 border-r border-slate-800">
                  <Icon name="wrench" className="w-3.5 h-3.5 text-cyan-400" />
                  <span>Builder:</span>
                </span>

                <button onClick={addNode} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-blue-600/30 text-xs font-semibold text-slate-200 hover:text-cyan-300 border border-slate-700">
                  <Icon name="server" className="w-3.5 h-3.5 text-blue-400" />
                  <span>+ Node</span>
                </button>

                <button onClick={() => setActiveModal('deployment')} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-cyan-600/30 text-xs font-semibold text-slate-200 hover:text-cyan-300 border border-slate-700">
                  <Icon name="layers" className="w-3.5 h-3.5 text-cyan-400" />
                  <span>+ Deployment</span>
                </button>

                <button onClick={() => setActiveModal('service')} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-amber-600/30 text-xs font-semibold text-slate-200 hover:text-amber-300 border border-slate-700">
                  <Icon name="share2" className="w-3.5 h-3.5 text-amber-400" />
                  <span>+ Service</span>
                </button>

                <button onClick={() => setActiveModal('namespace')} className="flex items-center gap-1 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-purple-600/30 text-xs font-semibold text-slate-200 hover:text-purple-300 border border-slate-700">
                  <Icon name="folder" className="w-3.5 h-3.5 text-purple-400" />
                  <span>+ Namespace</span>
                </button>
              </div>
            </div>
          )}

          {/* FLOATING TRAFFIC OVERLAY */}
          {packets.length > 0 && (
            <div className="fixed top-20 right-6 z-40 space-y-2 pointer-events-none">
              {packets.map(pkt => (
                <div key={pkt.id} className="bg-slate-900/95 border border-cyan-500 rounded-xl p-3 shadow-2xl w-72 backdrop-blur-xl animate-fadeIn">
                  <div className="flex justify-between text-xs font-mono mb-1 font-bold text-cyan-300">
                    <span className="flex items-center gap-1"><Icon name="zap" className="w-3 h-3 text-cyan-400" /> HTTP GET</span>
                    <span className="text-[10px] px-1 bg-cyan-500/20 rounded font-mono">{pkt.namespace}</span>
                  </div>
                  <div className="text-[11px] font-mono text-slate-300 truncate mb-1">{pkt.url}</div>
                  <div className="text-[10px] font-mono text-slate-400 flex items-center gap-1 truncate">
                    <span>Target:</span>
                    <span className="text-emerald-400">[{pkt.namespace}] {pkt.targetPod}</span>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* LOGS DRAWER */}
          <LogsDrawer logs={logs} />

          {/* CONCEPT & INSTANCE INSPECTOR MODAL */}
          {selectedElement && (
            <InspectorModal
              concept={K8S_CONCEPTS[selectedElement.id] || K8S_CONCEPTS['namespace']}
              onClose={() => setSelectedElement(null)}
            />
          )}

          {/* CREATE NAMESPACE MODAL */}
          {activeModal === 'namespace' && (
            <ModalWrapper title="Create New Kubernetes Namespace" onClose={() => setActiveModal(null)}>
              <form onSubmit={handleCreateNamespace} className="space-y-3 text-xs font-mono">
                <div>
                  <label className="block text-slate-400 mb-1">Namespace Name</label>
                  <input
                    type="text"
                    value={newNsName}
                    onChange={e => setNewNsName(e.target.value)}
                    placeholder="e.g. analytics, staging, payments"
                    className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white focus:border-purple-500 focus:outline-none"
                    required
                    autoFocus

                <button type="submit" className="w-full py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white font-bold mt-2">
                  Create Namespace
                </button>
              </form>
            </ModalWrapper>
          )}

          {/* CREATE DEPLOYMENT MODAL */}
          {activeModal === 'deployment' && (
            <ModalWrapper title="Create Deployment" onClose={() => setActiveModal(null)}>
              <form onSubmit={handleCreateDeployment} className="space-y-3 text-xs font-mono">

                <div>
                  <label className="block text-slate-400 mb-1">Target Namespace</label>
                  <select value={depForm.ns} onChange={e => setDepForm({...depForm, ns: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white">
                    {namespacesList.map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
                <div><label className="block text-slate-400 mb-1">Image</label><input type="text" value={depForm.image} onChange={e => setDepForm({...depForm, image: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-400 mb-1">Port</label><input type="number" value={depForm.port} onChange={e => setDepForm({...depForm, port: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                  <div><label className="block text-slate-400 mb-1">Replicas</label><input type="number" min="1" max="8" value={depForm.replicas} onChange={e => setDepForm({...depForm, replicas: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                </div>
                <button type="submit" className="w-full py-2 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold mt-2">Deploy Workload</button>
              </form>
            </ModalWrapper>
          )}

          {/* CREATE SERVICE MODAL */}
          {activeModal === 'service' && (
            <ModalWrapper title="Create Service" onClose={() => setActiveModal(null)}>
              <form onSubmit={handleCreateService} className="space-y-3 text-xs font-mono">
                <div><label className="block text-slate-400 mb-1">Name</label><input type="text" value={svcForm.name} onChange={e => setSvcForm({...svcForm, name: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                <div>
                  <label className="block text-slate-400 mb-1">Target Namespace</label>
                  <select value={svcForm.ns} onChange={e => setSvcForm({...svcForm, ns: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white">
                    {namespacesList.map(n => <option key={n} value={n}>{n}</option>)}
                  </select>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <div><label className="block text-slate-400 mb-1">Service Port</label><input type="number" value={svcForm.port} onChange={e => setSvcForm({...svcForm, port: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                  <div><label className="block text-slate-400 mb-1">Target Port</label><input type="number" value={svcForm.targetPort} onChange={e => setSvcForm({...svcForm, targetPort: e.target.value})} className="w-full bg-slate-950 border border-slate-800 rounded p-2 text-white" required /></div>
                </div>
                <button type="submit" className="w-full py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold mt-2">Create Service</button>
              </form>
            </ModalWrapper>
          )}
        </div>
      );
    }

    // --- MODAL WRAPPER HELPER ---
    function ModalWrapper({ title, onClose, children }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl animate-fadeIn">
            <div className="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
              <h3 className="font-mono font-bold text-white text-sm">{title}</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            {children}
          </div>
        </div>
      );
    }

    // --- LOGS DRAWER COMPONENT ---
    function LogsDrawer({ logs }) {
      const [open, setOpen] = useState(false);
      return (
        <div className="fixed bottom-0 right-6 z-30 w-80 max-w-[calc(100vw-3rem)] font-mono text-xs">
          <div
            onClick={() => setOpen(!open)}
            className="bg-slate-900 border border-slate-700 rounded-t-xl px-4 py-2 flex items-center justify-between cursor-pointer shadow-xl backdrop-blur-md"
          >
            <div className="flex items-center gap-2 font-bold text-slate-200">
              <Icon name="terminal" className="w-3.5 h-3.5 text-emerald-400" />
              <span>Cluster Events ({logs.length})</span>
            </div>
            <span className="text-slate-500">{open ? '▼' : '▲'}</span>
          </div>
          {open && (
            <div className="bg-slate-950 border-x border-b border-slate-800 p-3 h-64 overflow-y-auto space-y-1.5 rounded-b-xl shadow-2xl">
              {logs.map(l => (
                <div key={l.id} className="p-1.5 rounded bg-slate-900/80 border border-slate-800 text-[11px] leading-relaxed">
                  <div className="flex justify-between text-[9px] text-slate-500 mb-0.5">
                    <span className="font-bold text-cyan-400">{l.source}</span>
                    <span>{l.timestamp}</span>
                  </div>
                  <div className="text-slate-300">{l.message}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- TERMINAL SIMULATOR COMPONENT ---
    function TerminalSimulator({ runKubectl }) {
      const [input, setInput] = useState('');
      const [history, setHistory] = useState([
        { id: '1', text: 'KubeVerse Interactive Kubectl Terminal [v1.30.2]\nType "kubectl get ns" or "kubectl get pods -A" to explore cluster namespaces.' }
      ]);
      const endRef = useRef(null);

      useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [history]);

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!input.trim()) return;
        const out = runKubectl(input.trim());
        setHistory(prev => [...prev, { id: Math.random(), text: `$ ${input}` }, { id: Math.random(), text: out }]);
        setInput('');
      };

      return (
        <div className="bg-slate-950 border border-slate-800 rounded-2xl shadow-2xl p-4 font-mono text-xs flex flex-col h-[500px]">
          <div className="flex-1 overflow-y-auto space-y-2 text-slate-300 pr-2">
            {history.map(item => (
              <pre key={item.id} className="whitespace-pre-wrap leading-relaxed">{item.text}</pre>
            ))}
            <div ref={endRef}></div>
          </div>
          <form onSubmit={handleSubmit} className="flex items-center gap-2 pt-3 border-t border-slate-800 mt-2">
            <span className="text-emerald-400 font-bold">$</span>
            <input
              type="text"
              value={input}
              onChange={e => setInput(e.target.value)}
              placeholder="kubectl get ns, kubectl get pods -A, kubectl get svc -A"
              className="flex-1 bg-transparent text-white focus:outline-none placeholder:text-slate-600 text-xs"
              autoFocus
            />
          </form>
        </div>
      );
    }

    // --- INSPECTOR MODAL COMPONENT ---
    function InspectorModal({ concept, onClose }) {
      const [tab, setTab] = useState('overview');
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-5 border-b border-slate-800 flex justify-between items-center bg-slate-950/50">
              <div className="flex items-center gap-3">
                <div className="p-2.5 rounded-xl" style={{ backgroundColor: `${concept.color}20`, color: concept.color }}>
                  <Icon name={concept.iconName} className="w-6 h-6" />
                </div>
                <div>
                  <h3 className="font-mono font-bold text-lg text-white">{concept.name}</h3>
                  <p className="text-xs text-slate-400">{concept.shortDescription}</p>
                </div>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white p-1">✕</button>
            </div>

            <div className="flex border-b border-slate-800 px-5 gap-4 pt-2 text-xs font-mono font-bold">
              {['overview', 'commands', 'yaml'].map(t => (
                <button
                  key={t}
                  onClick={() => setTab(t)}
                  className={`pb-2 capitalize border-b-2 transition-all ${tab === t ? 'text-cyan-400 border-cyan-400' : 'text-slate-400 border-transparent hover:text-slate-200'}`}
                >
                  {t}
                </button>
              ))}
            </div>

            <div className="p-6 overflow-y-auto space-y-4 text-xs font-sans">
              {tab === 'overview' && (
                <div className="space-y-4">
                  {concept.analogy && (
                    <div className="p-3.5 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-200">
                      <div className="font-bold text-cyan-300 mb-1 flex items-center gap-1.5 uppercase font-mono text-[10px]">
                        <Icon name="sparkles" className="w-3.5 h-3.5 text-cyan-400" /> Real-World Analogy
                      </div>
                      <p className="italic">{concept.analogy}</p>
                    </div>
                  )}
                  <div>
                    <h4 className="font-mono font-bold text-slate-300 uppercase mb-2 text-[11px]">Why it matters & Key rules</h4>
                    <div className="space-y-1.5">
                      {concept.whyItMatters.map((point, i) => (
                        <div key={i} className="p-2.5 rounded-lg bg-slate-800/60 border border-slate-700 text-slate-300 flex items-start gap-2">
                          <span className="text-cyan-400 font-bold">•</span>
                          <span>{point}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {tab === 'commands' && (
                <div className="space-y-2.5 font-mono">
                  {concept.kubectlCommands.map((cmd, i) => (
                    <div key={i} className="p-3 rounded-xl bg-slate-950 border border-slate-800">
                      <div className="text-slate-400 text-[11px] mb-1 font-sans">{cmd.explanation}</div>
                      <div className="text-emerald-400 font-bold">$ {cmd.command}</div>
                    </div>
                  ))}
                </div>
              )}

              {tab === 'yaml' && (
                <pre className="p-4 rounded-xl bg-slate-950 border border-slate-800 text-cyan-300 font-mono text-xs overflow-x-auto">
                  <code>{concept.yamlSnippet}</code>
                </pre>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Render React to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
